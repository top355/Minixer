# =============================================================================
# 名称: Build Windows
# 触发:
#   1. push / pull_request —— 提交或 PR 时自动编译验证
#   2. push 标签 v*        —— 编译通过后自动创建 GitHub Release（见末尾 release job）
#   3. workflow_dispatch    —— 手动触发，可指定 JUCE 版本 tag
#
# 产物（Artifacts）:
#   - Minixer-windows-x64     : Minixer.exe + PluginHost64.exe（64 位主程序）
#   - PluginHost-windows-x86  : PluginHost32.exe（32 位插件桥接子进程）
#
# 发布（Release）:
#   推送形如 v0.4.1 的标签即自动发版（见末尾 release job）。
#
# 说明：JUCE（默认 8.0.10，已捆绑 VST3 SDK）与 Steinberg ASIO SDK 均在
#       构建时自动拉取，仓库内无需内置大文件。
#       CMake 单次配置只能构建单一架构，故 64 位与 32 位分为两个 job。
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      juce_tag:
        description: 'JUCE 版本 tag（默认 8.0.10）'
        required: false
        default: '8.0.10'

jobs:
  # ---------------------------------------------------------------------------
  # 翻译表完整性检查：确保新增/修改的 TRANS() 字符串都有中文译文。
  # 纯 Python，不依赖 JUCE，执行最快，先行失败可避免无意义的全量编译。
  # ---------------------------------------------------------------------------
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify translation coverage
        run: python3 tools/verify_translations.py

  # ---------------------------------------------------------------------------
  # x64：主程序 Minixer.exe + PluginHost64.exe
  # ---------------------------------------------------------------------------
  build-x64:
    needs: check-translations
    runs-on: windows-latest
    env:
      JUCE_TAG: ${{ github.event.inputs.juce_tag || '8.0.10' }}
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 拉取 JUCE（--depth 1 浅克隆；VST3 SDK 已随 JUCE 捆绑于
      # modules/juce_audio_processors/format_types/VST3_SDK）
      # ---------------------------------------------------------------------
      - name: Fetch JUCE
        shell: pwsh
        run: |
          $dest = "${{ runner.workspace }}/JUCE"
          git clone --depth 1 --branch "$env:JUCE_TAG" https://github.com/juce-framework/JUCE.git $dest
          if ($LASTEXITCODE -ne 0) { throw "JUCE clone failed (tag: $env:JUCE_TAG)" }
          "JUCE_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "JUCE_DIR=$dest"

      # ---------------------------------------------------------------------
      # 拉取 Steinberg ASIO SDK（多个备用地址，取第一个可用的）
      # ---------------------------------------------------------------------
      - name: Fetch ASIO SDK
        shell: pwsh
        run: |
          $urls = @(
            "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip",
            "https://www.steinberg.net/fileadmin/user_upload/ASIO-SDK_2.3.3_2019-06-14.zip"
          )
          $zip = "${{ runner.temp }}/asio-sdk.zip"
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Downloading $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -ErrorAction Stop
              $ok = $true
              break
            } catch {
              Write-Warning "Download failed: $u ($($_.Exception.Message))"
            }
          }
          if (-not $ok) { throw "ASIO SDK download failed" }

          $dest = "${{ runner.temp }}/asiosdk"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          # 解压后根目录名随版本变化，定位包含 common/iasiodrv.h 的目录
          $header = Get-ChildItem -Path $dest -Recurse -Filter "iasiodrv.h" | Select-Object -First 1
          if (-not $header) { throw "iasiodrv.h not found in ASIO SDK archive" }
          $asioDir = $header.Directory.Parent.FullName
          Write-Host "ASIO_DIR=$asioDir"
          "ASIO_DIR=$asioDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (x64)
        shell: pwsh
        run: cmake -B build-x64 -S . -A x64 -DJUCE_DIR="$env:JUCE_DIR" -DASIO_DIR="$env:ASIO_DIR"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build-x64 --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $stage = "${{ runner.workspace }}/stage-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # PluginHost64.exe 已被 POST_BUILD 复制到 Minixer 输出目录旁
          $exe = Get-ChildItem -Path build-x64 -Recurse -Filter "Minixer.exe" | Select-Object -First 1
          if (-not $exe) { throw "Minixer.exe not found" }
          Copy-Item $exe.FullName $stage

          $host64 = Get-ChildItem -Path build-x64 -Recurse -Filter "PluginHost64.exe" | Select-Object -First 1
          if ($host64) { Copy-Item $host64.FullName $stage } else { Write-Warning "PluginHost64.exe not found" }

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minixer-windows-x64
          path: ${{ runner.workspace }}/stage-x64/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Win32：仅构建 PluginHost32.exe（32 位插件桥接子进程）。
  # CMakeLists 在 32 位配置下会自动跳过 Minixer 主程序，只产出 PluginHost32。
  # ---------------------------------------------------------------------------
  build-plugins-x86:
    needs: check-translations
    runs-on: windows-latest
    env:
      JUCE_TAG: ${{ github.event.inputs.juce_tag || '8.0.10' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        shell: pwsh
        run: |
          $dest = "${{ runner.workspace }}/JUCE"
          git clone --depth 1 --branch "$env:JUCE_TAG" https://github.com/juce-framework/JUCE.git $dest
          if ($LASTEXITCODE -ne 0) { throw "JUCE clone failed (tag: $env:JUCE_TAG)" }
          "JUCE_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch ASIO SDK
        shell: pwsh
        run: |
          $urls = @(
            "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip",
            "https://www.steinberg.net/fileadmin/user_upload/ASIO-SDK_2.3.3_2019-06-14.zip"
          )
          $zip = "${{ runner.temp }}/asio-sdk.zip"
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Downloading $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -ErrorAction Stop
              $ok = $true
              break
            } catch {
              Write-Warning "Download failed: $u ($($_.Exception.Message))"
            }
          }
          if (-not $ok) { throw "ASIO SDK download failed" }

          $dest = "${{ runner.temp }}/asiosdk"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $header = Get-ChildItem -Path $dest -Recurse -Filter "iasiodrv.h" | Select-Object -First 1
          if (-not $header) { throw "iasiodrv.h not found in ASIO SDK archive" }
          $asioDir = $header.Directory.Parent.FullName
          "ASIO_DIR=$asioDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (Win32)
        shell: pwsh
        run: cmake -B build-x86 -S . -A Win32 -DJUCE_DIR="$env:JUCE_DIR" -DASIO_DIR="$env:ASIO_DIR"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build-x86 --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $stage = "${{ runner.workspace }}/stage-x86"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # CMakeLists 的 POST_BUILD 会把 PluginHost32.exe 复制到源码树
          # build/Minixer_artefacts/Release（供 x64 主程序调用）
          $host32 = Get-ChildItem -Path . -Recurse -Filter "PluginHost32.exe" | Select-Object -First 1
          if (-not $host32) { throw "PluginHost32.exe not found" }
          Copy-Item $host32.FullName $stage

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PluginHost-windows-x86
          path: ${{ runner.workspace }}/stage-x86/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅当推送 v* 标签时执行。
  # 复用上面两个 job 的产物（不重新编译），打包成 zip 并创建 GitHub Release。
  # ---------------------------------------------------------------------------
  release:
    needs: [build-x64, build-plugins-x86]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded layout
        run: find dist -type f | sort

      - name: Package release assets
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          out="$GITHUB_WORKSPACE/release"
          mkdir -p "$out"

          x64dir="$(dirname "$(find "$GITHUB_WORKSPACE/dist" -name 'Minixer.exe' -print -quit)")"
          x86dir="$(dirname "$(find "$GITHUB_WORKSPACE/dist" -name 'PluginHost32.exe' -print -quit)")"

          if [ ! -f "$x64dir/Minixer.exe" ]; then
            echo "::error::未找到 Minixer.exe 产物"; exit 1
          fi
          if [ ! -f "$x86dir/PluginHost32.exe" ]; then
            echo "::error::未找到 PluginHost32.exe 产物"; exit 1
          fi

          # 从父目录打包，让 zip 内保留一层同名文件夹（避免 ./ 前缀导致解压出怪路径）
          ( cd "$(dirname "$x64dir")" && zip -r "$out/Minixer-${ver}-windows-x64.zip" "$(basename "$x64dir")" )
          ( cd "$(dirname "$x86dir")" && zip -r "$out/Minixer-${ver}-windows-x86-pluginhost.zip" "$(basename "$x86dir")" )
          ls -lh "$out"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，改为补传/覆盖附件"
            gh release upload "$tag" release/*.zip --clobber
            exit 0
          fi

          args=(release create "$tag" --title "$tag" --generate-notes)
          case "$tag" in
            *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
          esac
          gh "${args[@]}" release/*.zip

          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
